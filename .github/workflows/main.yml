name: Continuous Integration, Delivery and Deployment With GitHub Actions to AWS Project

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  #=====================================
  # Provisiona/atualiza a infraestrutura
  #=====================================
  build-aws-services:
    name: Provision AWS infrastructure
    runs-on: ubuntu-latest
    environment: Variables
    outputs:
      ecr_repo_producer_url: ${{ steps.terraform-output.outputs.ECR_REPO_PRODUCER_URL }}
      ecr_repo_worker_url: ${{ steps.terraform-output.outputs.ECR_REPO_WORKER_URL }}
      ecs_cluster_name: ${{ steps.terraform-output.outputs.ECS_CLUSTER_NAME }}
      ecs_service_name_producer: ${{ steps.terraform-output.outputs.ECS_SERVICE_NAME_PRODUCER }}
      ecs_service_name_worker: ${{ steps.terraform-output.outputs.ECS_SERVICE_NAME_WORKER }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform init
        working-directory: infra/terraform
        run: terraform init

      - name: Terraform plan
        working-directory: infra/terraform
        env:
          TF_VAR_region: ${{ secrets.AWS_REGION }}
          TF_VAR_aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          TF_VAR_aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          TF_VAR_email: ${{ secrets.USER_EMAIL }}
        run: terraform plan

      - name: Terraform apply
        working-directory: infra/terraform
        env:
          TF_VAR_region: ${{ secrets.AWS_REGION }}
          TF_VAR_aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          TF_VAR_aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          TF_VAR_email: ${{ secrets.USER_EMAIL }}
        run: terraform apply -auto-approve

      - name: Terraform output
        id: terraform-output
        working-directory: infra/terraform
        run: |
          echo "ECR_REPO_PRODUCER_URL=$(terraform output -raw ecr_repo_producer_url)" >> "$GITHUB_OUTPUT"
          echo "ECR_REPO_WORKER_URL=$(terraform output -raw ecr_repo_worker_url)" >> "$GITHUB_OUTPUT"
          echo "ECS_CLUSTER_NAME=$(terraform output -raw ecs_cluster_name)" >> "$GITHUB_OUTPUT"
          echo "ECS_SERVICE_NAME_PRODUCER=$(terraform output -raw ecs_service_name_producer)" >> "$GITHUB_OUTPUT"
          echo "ECS_SERVICE_NAME_WORKER=$(terraform output -raw ecs_service_name_worker)" >> "$GITHUB_OUTPUT"

  #=====================================
  # Build dos JARs (rodam em paralelo, não dependem da infra existir)
  #=====================================
  build-producer-api:
    name: Build producer-api
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build producer-api
        working-directory: produce-api
        run: mvn clean package -DskipTests

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: produce-app
          path: produce-api/target/*.jar

  build-worker-api:
    name: Build worker-api
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build worker-api
        working-directory: worker-api
        run: mvn clean package -DskipTests

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: worker-app
          path: worker-api/target/*.jar

  #=====================================
  # Deploy do Producer (imagem 1 de 2)
  #=====================================
  deploy-producer:
    name: Build, push and deploy producer-ap
    environment: Variables i
    runs-on: ubuntu-latest
    needs: [ build-aws-services, build-producer-api ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: produce-app
          path: produce-api/target

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # Runner do GitHub Actions já é linux/amd64 nativo - não precisa do
      # --platform que você usava no Mac, o build já sai na arquitetura certa.
      - name: Build and push image
        working-directory: produce-api
        env:
          IMAGE_URI: ${{ needs.build-aws-services.outputs.ecr_repo_producer_url }}
        run: |
          docker build -t "$IMAGE_URI:latest" -t "$IMAGE_URI:${{ github.sha }}" .
          docker push "$IMAGE_URI:latest"
          docker push "$IMAGE_URI:${{ github.sha }}"

      - name: Force new ECS deployment
        env:
          CLUSTER: ${{ needs.build-aws-services.outputs.ecs_cluster_name }}
          SERVICE: ${{ needs.build-aws-services.outputs.ecs_service_name_producer }}
        run: |
          aws ecs update-service --cluster "$CLUSTER" --service "$SERVICE" --force-new-deployment

  #=====================================
  # Deploy do Worker (imagem 2 de 2)
  #=====================================
  deploy-worker:
    name: Build, push and deploy worker-api
    runs-on: ubuntu-latest
    environment: Variables
    needs: [ build-aws-services, build-worker-api ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: worker-app
          path: worker-api/target

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        working-directory: worker-api
        env:
          IMAGE_URI: ${{ needs.build-aws-services.outputs.ecr_repo_worker_url }}
        run: |
          docker build -t "$IMAGE_URI:latest" -t "$IMAGE_URI:${{ github.sha }}" .
          docker push "$IMAGE_URI:latest"
          docker push "$IMAGE_URI:${{ github.sha }}"

      - name: Force new ECS deployment
        env:
          CLUSTER: ${{ needs.build-aws-services.outputs.ecs_cluster_name }}
          SERVICE: ${{ needs.build-aws-services.outputs.ecs_service_name_worker }}
        run: |
          aws ecs update-service --cluster "$CLUSTER" --service "$SERVICE" --force-new-deployment